spring:
  application:
    name: musical-sniffle-api
  profiles:
    # Carga application-local.yml (secretos solo en tu máquina)
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/musical_sniffle}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

app:
  demo-data: ${APP_DEMO_DATA:false}
  jwt:
    # Obligatorio: definilo en application-local.yml o JWT_SECRET
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  estacionamiento:
    plaza-obligatoria: false
  mercadopago:
    enabled: ${MP_ENABLED:false}
    access-token: ${MP_ACCESS_TOKEN:}
    sandbox: ${MP_SANDBOX:true}
    # En local: URL de ngrok + /api/webhooks/mercadopago
    notification-url: ${MP_NOTIFICATION_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
