spring:
  application:
    name: musical-sniffle-api

  datasource:
    url: jdbc:postgresql://localhost:5432/musical_sniffle
    username: postgres
    password: "1234"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: musical-sniffle-jwt-secret-key-minimo-32-chars!!
    expiration-ms: 86400000
  estacionamiento:
    plaza-obligatoria: false
  mercadopago:
    enabled: false
    access-token: ${MP_ACCESS_TOKEN:}
    # En local: URL de ngrok + /api/webhooks/mercadopago
    notification-url: ${MP_NOTIFICATION_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
